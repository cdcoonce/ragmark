# Reference instance — the owner's vault, as a sibling checkout.
# Paths resolve relative to this file. The context policy shown here is also the
# package default; it is spelled out so the reference instance is explicit about
# the asymmetry it relies on (see src/ragmark/config.py for the rationale).

vault_root = "../../the-vault"

# Directories never indexed (dot-directories are always excluded).
excluded_dirs = ["templates", "session-logs"]

# Owner corpus policy, approved in ragmark#94 on 2026-10-03. These are literal
# names/prefixes, not globs. Root operating files are outside the folder scope.
scoped_folders = ["brain", "work", "personal", "org", "perf", "reference", "school", "thinking"]
excluded_filenames = ["AGENTS.md", "AGENTS.local.md", "CLAUDE.md", "CLAUDE.local.md"]
excluded_path_prefixes = [
    "work/Tasks.md",
    "personal/tasks/",
    "personal/archive/tasks/",
    "work/tasks/",
    "work/archive/tasks/",
    "work/archive/2026/tasks/",
]

[context_dirs]
work = "work"
personal = "personal"

[visible_scopes]
personal = ["personal", "work"]
work = ["work"]
